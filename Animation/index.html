<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        body{
            margin: 0;
            height: 100vh;
            background-color: skyblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            border: 5px solid red;
            height: 500px;
            width: 500px;
            /* position: relative; */
            animation: orbit 1s linear infinite normal;
            border-radius: 50%;
        }
        .box{
            height: 150px;
            width: 150px;
            background-color: aliceblue;
            animation-name: orbit;
            animation-duration: 1s;
            /* animation-iteration-count: infinite; */
            /* animation-delay: 2s; */
            /* animation-direction: normal; */
            /* position: absolute; */
            border-radius: 50%;
        }
        .box{
            height: 150px;
            width: 150px;
            background-color: aliceblue;
            animation-name: orbit;
            animation-duration: 1s;
            /* animation-iteration-count: infinite; */
            /* animation-delay: 2s; */
            /* animation-direction: normal; */
            /* position: absolute; */
            border-radius: 50%;
        }
        @keyframes circle{
            0%{
                transform: translate(0,0);
            }
            25%{
                transform: translate(400px,0);
            }
            50%{
                transform: translate(400px,400px);
            }
            75%{
                transform: translate(0,400px);
            }
            100%{
                transform: translate(0,0);
            }
        }
        @keyframes orbit{
            from{
                transform: rotate(0deg);

            }
            to{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
